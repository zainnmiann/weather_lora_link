; Weather station -> LoRa P2P -> MQTT link.
;   station : ESP32 inside the weather station + Wio-E5-LE-HF (stock AT firmware)
;   gateway : ESP32 with WiFi + LoRa-E5 mini (stock AT firmware)
; Shared protocol code lives in lib/wxlink. Build both: `pio run`; one: `pio run -e station`.

[platformio]
default_envs = station, station_micromod, station_lakelink, gateway

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -I include
  -DCORE_DEBUG_LEVEL=0
  ; E5_RST_PIN = -1 when the radio board's reset pin is not wired.
  -DE5_RST_PIN=-1

; ESP32 UART2 <-> LoRa-E5 mini AT serial pins (cross TX/RX), for a plain ESP32 dev board.
[devkit_radio]
build_flags =
  -DE5_RX_PIN=16
  -DE5_TX_PIN=17

[env:station]
build_src_filter = +<station/>
build_flags =
  ${env.build_flags}
  ${devkit_radio.build_flags}
  -DWX_STATION_ID=1
  ; Fake readings for bench testing. Set to 0 once sensorRead() talks to the real sensor.
  -DWX_FAKE_SENSOR=1
  ; ADC pin of the battery divider, -1 = not wired. Battery mV = pin mV * BATT_DIVIDER.
  -DBATT_ADC_PIN=-1
  -DBATT_DIVIDER=2.0f

; The real weather station: SparkFun MicroMod Weather Carrier Board + MicroMod ESP32 processor.
; GPIO 16/17 are taken (UART1, likely the SIM800L), so the radio needs two other free pins.
; E5_RX_PIN / E5_TX_PIN below are PLACEHOLDERS (G5/G6): confirm they are reachable on the carrier.
[env:station_micromod]
build_src_filter = +<station/>
build_flags =
  ${env.build_flags}
  -DWX_STATION_ID=1
  -DWX_SENSOR_MICROMOD=1
  -DE5_RX_PIN=32
  -DE5_TX_PIN=33
  ; BATT_VIN/3 is wired to GPIO 39 on the MicroMod ESP32.
  -DBATT_ADC_PIN=39
  -DBATT_DIVIDER=3.0f
lib_deps =
  sparkfun/SparkFun BME280
  sparkfun/SparkFun AS3935 Lightning Detector Arduino Library

; LakeLink station: the weather station's own MicroMod ESP32 reads its sensors and sends over LoRa itself
; (LoRa-E5 mini on two free GPIOs, AT firmware). E5 pins 32/33 are PLACEHOLDERS until the carrier's
; free pins are confirmed. For desk tests the interval and frequency can be overridden.
[env:station_lakelink]
build_src_filter = +<station_lakelink/>
upload_speed = 230400  ; 460800/921600 fail on this MicroMod ESP32
build_flags =
  ${env.build_flags}
  -DE5_RX_PIN=32
  -DE5_TX_PIN=33
  -DNODE_ID=1
  -DNEXT_HOP=2
  -DWX_STATION_ID=1
lib_deps =
  sparkfun/SparkFun BME280
  sparkfun/SparkFun AS3935 Lightning Detector Arduino Library
  sparkfun/SparkFun Weather Meter Kit Arduino Library

; Office test build: 869.525 MHz (10 % sub-band, same as the Pi relay's relay.env), a reading every 60 s.
[env:station_lakelink_test]
extends = env:station_lakelink
build_flags =
  ${env:station_lakelink.build_flags}
  -DWX_INTERVAL_S=60
  -DWX_FREQ_MHZ=\"869.525\"
  -DWX_LOG_HELD

; Office test without soldering: radio = LoRa #2 on the laptop, reached through tools/usb_bridge.py.
[env:station_lakelink_usb]
extends = env:station_lakelink_test
build_flags =
  ${env:station_lakelink_test.build_flags}
  -DE5_VIA_USB

[env:gateway]
build_src_filter = +<gateway/>
build_flags =
  ${env.build_flags}
  ${devkit_radio.build_flags}
lib_deps =
  knolleary/PubSubClient@^2.8

; Test only: SIM800L probe (status queries) on the weather station ESP32.
[env:sim_probe]
build_src_filter = +<sim_probe/>
upload_speed = 230400

; LakeLink station over cellular: the weather station's ESP32 + its SIM800L (RX1/TX1) -> cloud server.
; CELL_URL is set once the server exists; empty = modem exercised, nothing sent.
[env:station_cellular]
build_src_filter = +<station_cellular/>
upload_speed = 230400
build_flags =
  ${env.build_flags}
  -DWX_STATION_ID=1
  ; by hostname: the IoT SIM's Güvenli Internet filter drops plain-IP connections
  -DCELL_URL=\"http://api.d7tech.net/api/v1/ingest\"
  ; the 433 MHz SX1278 (LoRa tests) on this bus, NSS GPIO12: kept asleep
  -DLORA_PARK_NSS=12
lib_deps =
  sparkfun/SparkFun BME280
  sparkfun/SparkFun AS3935 Lightning Detector Arduino Library
  sparkfun/SparkFun Weather Meter Kit Arduino Library

; LakeLink hop network on 433 MHz SX1278 radios (Ra-01 / XL1278-SMT on SPI 18/19/23, no DIO0 / RESET wired).
; One firmware (src/hop_node), role per env. 434.0 MHz, 10 dBm, SF9; 10 % duty band (433.05-434.79 MHz).
[hop_common]
build_src_filter = +<hop_node/>
lib_deps =
  sparkfun/SparkFun BME280
  sparkfun/SparkFun AS3935 Lightning Detector Arduino Library
  sparkfun/SparkFun Weather Meter Kit Arduino Library

; The weather station (MicroMod ESP32): Ra-01 NSS on GPIO12.
[env:hop_station]
build_src_filter = ${hop_common.build_src_filter}
lib_deps = ${hop_common.lib_deps}
upload_speed = 230400
build_flags =
  ${env.build_flags}
  -DROLE=1
  -DNODE_ID=1
  -DNEXT_HOP=2
  -DWX_STATION_ID=1
  -DLORA_NSS=12
  -DWX_INTERVAL_S=60

; ESP32 DevKit + XL1278-SMT (NSS GPIO5) as the gateway (prints DELIVERED lines on USB).
[env:hop_gateway]
build_src_filter = ${hop_common.build_src_filter}
lib_deps = ${hop_common.lib_deps}
build_flags =
  ${env.build_flags}
  -DROLE=3
  -DNODE_ID=2
  -DLORA_NSS=5

; The DevKit gateway that also uploads to the cloud server through its SIM800L (IoT SIM).
[env:hop_gateway_cell]
build_src_filter = ${hop_common.build_src_filter}
lib_deps = ${hop_common.lib_deps}
build_flags =
  ${env.build_flags}
  -DROLE=3
  -DNODE_ID=2
  -DLORA_NSS=5
  ; by hostname: the IoT SIM's Güvenli Internet filter drops plain-IP connections
  -DCELL_URL=\"http://api.d7tech.net/api/v1/ingest\"

; The weather station sending to the gateway every 5 min, like the cellular/USB firmware.
[env:hop_station_5min]
build_src_filter = ${hop_common.build_src_filter}
lib_deps = ${hop_common.lib_deps}
upload_speed = 230400
build_flags =
  ${env.build_flags}
  -DROLE=1
  -DNODE_ID=1
  -DNEXT_HOP=2
  -DWX_STATION_ID=1
  -DLORA_NSS=12

; The same DevKit as a relay between the station and a gateway with id 3.
[env:hop_relay]
build_src_filter = ${hop_common.build_src_filter}
lib_deps = ${hop_common.lib_deps}
build_flags =
  ${env.build_flags}
  -DROLE=2
  -DNODE_ID=2
  -DNEXT_HOP=3
  -DLORA_NSS=5

; Desk test: the station's radio at 2 dBm (lower supply current during TX).
[env:hop_station_2dbm]
extends = env:hop_station
build_flags =
  ${env:hop_station.build_flags}
  -DHOP_POWER_DBM=2
