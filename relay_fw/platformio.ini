; LakeLink relay firmware: runs directly on the LoRa-E5 mini's STM32WLE5JC (no computer, no ESP32).
; Flashed with an ST-Link V2 (SWD). Speaks the same hop protocol as tools/hopnet.py.
[env:relay]
platform = ststm32
board = lora_e5_mini
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
lib_deps = jgromes/RadioLib@^7.1.0
lib_extra_dirs = ../lib     ; shared hop-frame code in ../lib/hoplink
lib_ignore = wxlink         ; ESP32-only (only its wx_config.h header is used)
build_flags =
  -I ../include          ; secrets.h / secrets.example.h (shared HMAC key)
  -I ../lib/wxlink       ; wx_config.h defaults
  -DNODE_ID=2
  -DNEXT_HOP=3
  ; Antenna switch mode of this module. NOT YET VERIFIED for the Wio-E5-LE: 1 = low-power PA path
  ; (TX_LP, PA4=1 PA5=1), 0 = high-power PA path (TX_HP, PA4=0 PA5=1). Confirm on hardware first.
  -DRFSW_USE_LP=1
  -DRADIO_FREQ_MHZ=868.1
  -DRADIO_SF=9
  -DRADIO_POWER_DBM=14
  ; newlib-nano drops float support in printf by default; the log prints RSSI/SNR and frequency
  -Wl,-u,_printf_float
